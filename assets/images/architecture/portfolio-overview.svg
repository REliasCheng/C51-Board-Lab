<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Board Resource Planner</title><desc id="desc">Module requirements become resource masks, pass through conflict detection, and produce either an accepted plan or a conflict report.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b949e"/></marker><style>.bg{fill:#0d1117}.grid{stroke:#30363d;opacity:.28}.box{stroke-width:2}.input{fill:#21262d;stroke:#8b949e}.core{fill:#0d419d;stroke:#58a6ff}.hardware{fill:#1f6f3d;stroke:#3fb950}.output{fill:#f0f6fc;stroke:#c9d1d9}.warn{fill:#4d2d00;stroke:#d29922}.title{font:700 28px system-ui,sans-serif;fill:#f0f6fc}.sub{font:16px system-ui,sans-serif;fill:#8b949e}.label{font:700 17px system-ui,sans-serif;fill:#f0f6fc;text-anchor:middle}.detail{font:13px system-ui,sans-serif;fill:#c9d1d9;text-anchor:middle}.dark{fill:#0d1117}.arrow{fill:none;stroke:#8b949e;stroke-width:3;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1200" height="430" rx="22"/><path class="grid" d="M0 105H1200M0 340H1200M300 0V430M600 0V430M900 0V430"/>
  <text class="title" x="50" y="52">Board Resource Planner</text><text class="sub" x="50" y="82">Requirements become explicit resource decisions before firmware integration</text>
  <rect class="box input" x="45" y="185" width="190" height="90" rx="14"/><text class="label" x="140" y="221">Requirement</text><text class="detail" x="140" y="249">selected modules</text>
  <rect class="box core" x="305" y="185" width="210" height="90" rx="14"/><text class="label" x="410" y="221">Resource Mapping</text><text class="detail" x="410" y="249">GPIO · timer · bus</text>
  <rect class="box core" x="585" y="185" width="210" height="90" rx="14"/><text class="label" x="690" y="221">Conflict Detection</text><text class="detail" x="690" y="249">shared mask</text>
  <rect class="box hardware" x="900" y="130" width="240" height="90" rx="14"/><text class="label" x="1020" y="166">Accepted Plan</text><text class="detail" x="1020" y="194">no shared resource</text>
  <rect class="box warn" x="900" y="270" width="240" height="90" rx="14"/><text class="label" x="1020" y="306">Conflict Report</text><text class="detail" x="1020" y="334">modules + resource bits</text>
  <path class="arrow" d="M235 230H305M515 230H585M795 215L900 175M795 245L900 315"/>
</svg>
